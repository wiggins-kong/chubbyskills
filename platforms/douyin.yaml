id: douyin
name: Douyin
skill: douyin-transcribe
script: scripts/transcribe.py
category: video
status: heavy
source_types: [video, note]
required_deps: [python:websocket, cmd:ffmpeg, python:funasr]
optional_deps: []
output_contract: markdown_schema_v1
fallback: audio transcription
failure_modes: [expired_short_link, anti_bot, browser_unavailable, cdp_timeout, rate_limited, ffmpeg_or_funasr_missing, download_blocked]
fallback_command: save video locally, then run python3 douyin-transcribe/scripts/transcribe.py "<local-video>" output
sample_source: https://v.douyin.com/example/
notes: Capture is CDP-only: a headless Chromium in its own profile opens the iesdouyin share page and reads the aweme/detail response the page itself requests, with no cookies and without touching the user's browser. The share page now returns only an anti-bot shell and cookie-less yt-dlp gets 403, so both old paths were removed. Image posts (non-empty images) save images + desc instead of transcribing. Run douyin-transcribe/scripts/bootstrap.py when websocket-client or a browser is missing.
