id: zhihu
name: Zhihu
skill: zhihu-transcribe
script: scripts/transcribe.py
category: video
status: beta
source_types: [article, note, image, video]
required_deps: [cmd:yt-dlp, cmd:ffmpeg, python:funasr]
optional_deps: [python:websocket]
output_contract: markdown_schema_v1
fallback: CDP login-gate capture for answers/articles; audio transcription after yt-dlp download for pure videos
failure_modes: [question_only_url, embedded_video_unavailable, anti_bot, login_required, missing_yt_dlp, ffmpeg_or_funasr_missing, download_blocked]
fallback_command: download video locally, then run python3 zhihu-transcribe/scripts/transcribe.py "<local-video>" --output output
sample_source: https://www.zhihu.com/video/1234567890
notes: Supports answer/article text+image capture (HTTP with Desktop CDP fallback) and standalone/pure-video transcription; rejects question-only URLs.
