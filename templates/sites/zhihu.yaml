id: zhihu
platform: zhihu
name: Zhihu note and video
match: [zhihu.com/video, zhihu.com/zvideo, zhihu.com/question, zhuanlan.zhihu.com]
capture: article note image video audio transcription
frontmatter: [title, type, platform, note_type, source, author, created, tags, language, transcriber, schema_version, run_id, source_hash, captured_at, processed_at, content_type, status, assets]
assets: [article_images]
postprocess: [validate_schema_v1, enrich_optional, vault_copy_optional]
notes: Keep original answer/article URL as source; question-only URLs require a specific answer or article link.
