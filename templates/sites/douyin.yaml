id: douyin
platform: douyin
name: Douyin video and image post
match: [douyin.com, iesdouyin.com]
capture: video audio transcription note images
frontmatter: [title, type, platform, source, author, created, tags, language, transcriber, schema_version, run_id, source_hash, captured_at, processed_at, content_type, status, assets]
assets: []
postprocess: [validate_schema_v1, enrich_optional, vault_copy_optional]
notes: Keep stderr actionable because platform links expire quickly. Capture goes through a local headless Chromium via CDP; image posts are stored with local assets.
